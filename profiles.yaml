# Installation profiles. Each profile selects one or more package groups
# (categories from packages/*.yaml). Profiles are additive and composable:
# `full` includes `slim`, never the reverse.
profiles:
  slim:
    description: Essential CLI tools and everyday developer tooling.
    groups:
      - core
      - cli-essentials
  full:
    description: Everything — CLI tools, full dev tooling, and GUI apps.
    includes:
      - slim
    groups:
      - cli-full
      - gui
      - fonts
