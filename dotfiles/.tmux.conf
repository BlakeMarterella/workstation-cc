# Set prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -f default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -f renumber-windows on  # Renumber windows on close
set -sg escape-time 0       # Remove delay when pressing escape
set -g focus-events on      # Allow tmux to detect when it is focused
set -g set-clipboard on     # Use system clipboard
set -g mouse on

# Session Management
bind s choose-tree -sZ
bind d detach-client
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Window Navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window

# Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# No prefix alt+arrow navigation
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Pane Splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane Resizing (5 cells at a time)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane Management
bind x kill-pane
bind z resize-pane -Z 
bind Space next-layout
bind = select-layout tiled

# Copy Mode (vim-like)
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Status Bar
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#(fg=#89b4fa,bold) #S "
set -g status-right "#(fg=#89b4fa) %H:%M "
set -g status-left-length 30
set -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W #[default]"
set -g window-status-format "#[bg=#1e1e2e,fg=#cdd6f4] #I:#W #[default]"

# Pane Border
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

set -g set-titles on
set -g set-titles-string "#S / #W"

bind -r g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E $SHELL