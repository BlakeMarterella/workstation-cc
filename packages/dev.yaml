category: dev
description: Developer tooling and language runtimes.
packages:
  - name: neovim
    description: Hyperextensible Vim-based text editor
    managers:
      brew: neovim
      apt: neovim
      dnf: neovim
  - name: tmux
    description: Terminal multiplexer
    managers:
      brew: tmux
      apt: tmux
      dnf: tmux
  - name: gh
    description: GitHub CLI
    managers:
      brew: gh
      apt: gh
      dnf: gh
  - name: lazygit
    description: Terminal UI for git
    managers:
      brew: lazygit
      dnf: lazygit
  - name: go
    description: Go programming language
    managers:
      brew: go
      apt: golang-go
      dnf: golang
  - name: node
    description: Node.js JavaScript runtime
    managers:
      brew: node
      apt: nodejs
      dnf: nodejs
