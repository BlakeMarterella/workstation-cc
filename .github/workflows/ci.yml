name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate embedded data
        run: go generate ./...
        working-directory: wizard

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        working-directory: wizard

      - name: Vet
        run: go vet ./...
        working-directory: wizard

      - name: Test
        run: go test ./...
        working-directory: wizard

      - name: Build
        run: go build ./...
        working-directory: wizard
